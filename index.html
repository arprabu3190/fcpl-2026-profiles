<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031f18"><title>FCPL 2026</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><img src="fcpl-logo.png" alt="FCPL"><div><b>FCPL 2026</b><small>FIRSTCITY PREMIER LEAGUE</small></div></div><nav><button data-view="home" class="active">Home</button><button data-view="players">Players</button><button data-view="showcase">Player Showcase</button><button data-view="teams">Teams</button><button data-view="admin">Admin</button></nav><button id="fs" class="round">⛶</button></header>
<main>
<section id="home" class="view active scroll"><div class="homeHero"><div><small>FIRSTCITY PREMIER LEAGUE</small><h1>One Community.<br>Six Teams. One Champion.</h1><p>Meet the captains. Explore the players. Follow the auction.</p><div class="actions"><button data-go="teams">Explore Teams →</button><button data-go="players">Browse Players →</button></div></div></div><div id="homeStats" class="homeStats"></div><h2 class="sectionTitle">The Teams</h2><div id="homeTeams" class="homeTeams"></div></section>
<section id="players" class="view scroll"><div class="filters"><input id="search" placeholder="Search player or ID"><select id="role"><option value="">All roles</option></select><select id="status"><option value="">All statuses</option><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select><select id="playerTeamFilter"><option value="">All teams</option><option value="UNALLOCATED">Not allocated</option></select></div><div id="playersList"></div></section>
<section id="showcase" class="view"><div class="showNav"><button id="prev">‹ Previous</button><select id="pick"></select><span id="count"></span><button id="next">Next ›</button></div><div id="profile"></div></section>
<section id="teams" class="view scroll"><div id="teamsOverview"><h1>Meet the Teams</h1><p>6 teams. One league.</p><div id="teamsGrid" class="teamsGrid"></div></div><div id="teamDetail" class="hidden"></div></section>
<section id="admin" class="view scroll"><div class="admin"><div id="loginPanel"><h1>Administrator sign in</h1><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login" class="primary">Sign in</button><p id="loginMsg"></p></div><div id="adminPanel" class="hidden"><div class="adminHead"><h1>Player allocation</h1><button id="logout">Sign out</button></div><label>Player<select id="adminPlayer"></select></label><label>Status<select id="adminStatus"><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></label><label id="teamLabel">Team<select id="adminTeam"></select></label><label id="priceLabel">Sold price<input id="adminPrice" type="number" min="0"></label><button id="save" class="primary">Save centrally</button><p id="adminMsg"></p></div></div></section>
</main>
<dialog id="playerDialog"><button id="closeDialog" class="dialogClose">×</button><div id="dialogBody"></div></dialog><dialog id="confirm"><form method="dialog"><h2>Confirm auction update</h2><div id="confirmBody"></div><div class="dialogActions"><button value="cancel">Cancel</button><button id="confirmSave" value="default" class="primary">Confirm</button></div></form></dialog>
<div id="live" class="live">Connecting…</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
