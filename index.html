<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCPL 2026 Player Profile Showcase</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><span class="eyebrow">FCPL 2026</span><h1>Player Profile Showcase</h1></div><nav><button data-view="gallery" class="active">Players</button><button data-view="showcase">Showcase</button><button data-view="admin">Admin</button></nav></header>
<main>
<section id="gallery" class="view active"><div class="toolbar"><input id="search" type="search" placeholder="Search player name or ID"><select id="roleFilter"><option value="">All roles</option></select><select id="statusFilter"><option value="">All statuses</option><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></div><div id="playerGrid" class="grid"></div></section>
<section id="showcase" class="view"><div class="showcase-nav"><button id="prev">Previous</button><select id="playerSelect"></select><button id="next">Next</button></div><div id="profile"></div></section>
<section id="admin" class="view"><div class="admin-card"><h2>Player allocation</h2><label>Player<select id="adminPlayer"></select></label><label>Status<select id="adminStatus"><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></label><label id="teamWrap">Team<select id="adminTeam"><option value="">Select team</option></select></label><label id="priceWrap">Sold price<input id="adminPrice" type="number" min="0" step="1" placeholder="Enter amount"></label><button id="savePlayer" class="primary">Save player</button><p id="adminMessage" aria-live="polite"></p><div class="backup"><button id="exportResults">Export results</button><label class="file">Import results<input id="importResults" type="file" accept="application/json"></label><button id="resetResults" class="danger">Reset all</button></div><p class="note">Changes are saved only in this browser. Export results regularly as a backup.</p></div></section>
</main><dialog id="profileDialog"><button id="closeDialog" class="close">Close</button><div id="dialogContent"></div></dialog><script src="data.js"></script><script src="app.js"></script></body></html>
