<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031f18"><title>FCPL 2026 Player Showcase</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="brand"><img src="fcpl-logo.png" alt="FCPL logo"><div><strong>FCPL 2026</strong><small>FIRSTCITY PREMIER LEAGUE</small></div></div><nav><button data-view="gallery">Players</button><button data-view="showcase" class="active">Player Showcase</button><button data-view="admin">Admin</button></nav><button id="fullscreen" class="fullscreen" aria-label="Full screen">⛶</button></header>
<main>
<section id="showcase" class="view active"><div class="player-nav"><button id="prev">‹ <span>Previous</span></button><select id="playerPick"></select><span id="counter"></span><button id="next"><span>Next</span> ›</button></div><div id="profile"></div></section>
<section id="gallery" class="view scrollable"><div class="filters"><input id="search" type="search" placeholder="Search player or ID"><select id="roleFilter"><option value="">All roles</option></select><select id="statusFilter"><option value="">All statuses</option><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></div><div id="grid" class="grid"></div></section>
<section id="admin" class="view scrollable"><div class="admin-card"><h1>Player allocation</h1><label>Player<select id="adminPlayer"></select></label><label>Status<select id="adminStatus"><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></label><label id="teamWrap">Team<select id="adminTeam"><option value="">Select team</option></select></label><label id="priceWrap">Sold price<input id="soldPrice" type="number" min="0" step="1"></label><button id="save" class="save">Save player</button><p id="message" aria-live="polite"></p><div class="backup"><button id="export">Export results</button><label>Import results<input id="import" type="file" accept="application/json"></label><button id="reset">Reset all</button></div><p class="note">Updates stay in this browser. Export results regularly.</p></div></section>
</main><script src="data.js"></script><script src="app.js"></script></body></html>
