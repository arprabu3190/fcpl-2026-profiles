<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b36"><title>FCPL 2026 Player Profile Showcase</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><p class="eyebrow">FCPL 2026</p><h1>Player Profile Showcase</h1></div><nav><button data-view="gallery" class="active">Players</button><button data-view="auction">Profile showcase</button><button data-view="admin">Admin</button></nav></header>
<main><section id="galleryView"><div class="toolbar"><input id="search" placeholder="Search player" aria-label="Search player"><select id="roleFilter"><option value="">All roles</option></select><select id="statusFilter"><option value="">All statuses</option><option>Available</option><option>Sold</option><option>Unsold</option></select></div><div id="summary" class="summary"></div><div id="cards" class="cards"></div></section>
<section id="auctionView" hidden><div class="auction-wrap"><button id="prevPlayer" class="nav-arrow">‹</button><article id="auctionCard" class="auction-card"></article><button id="nextPlayer" class="nav-arrow">›</button></div></section>
<section id="adminView" hidden><div class="admin-panel"><h2>Profile allocation control</h2><p class="note">Changes are saved only in this browser. Use Export after the auction for backup.</p><label>Player<select id="adminPlayer"></select></label><label>Status<select id="adminStatus"><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></label><label>Base price<input id="adminBase" type="number" min="0"></label><label>Team<select id="adminTeam"><option value="">Select team</option></select></label><label>Sold price<input id="adminSold" type="number" min="0"></label><div class="actions"><button id="savePlayer" class="primary">Save player</button><button id="exportData">Export results</button><label class="import">Import results<input id="importData" type="file" accept="application/json"></label><button id="resetData" class="danger">Reset all</button></div><p id="adminMessage" aria-live="polite"></p></div></section></main>
<dialog id="playerDialog"><button id="closeDialog" aria-label="Close">×</button><div id="dialogBody"></div></dialog><footer>FCPL 2026 • Public player profiles</footer><script src="data.js"></script><script src="app.js"></script></body></html>
