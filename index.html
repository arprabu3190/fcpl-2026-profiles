<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031f18"><title>FCPL 2026 Player Showcase</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><img src="fcpl-logo.png" alt="FCPL logo"><div><b>FCPL 2026</b><small>FIRSTCITY PREMIER LEAGUE</small></div></div><nav><button data-view="gallery">Players</button><button data-view="showcase" class="active">Player Showcase</button><button data-view="admin">Admin</button></nav><button id="fs" class="fs">⛶</button></header><main><section id="showcase" class="view active"><div class="player-nav"><button id="prev">‹ Previous</button><select id="pick"></select><span id="count"></span><button id="next">Next ›</button></div><div id="profile"></div></section><section id="gallery" class="view scroll"><div class="filters"><input id="search" placeholder="Search player or ID"><select id="role"><option value="">All roles</option></select><select id="filterStatus"><option value="">All statuses</option><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></div><div id="grid"></div></section><section id="admin" class="view scroll"><div class="admin-card"><h1>Player allocation</h1><label>Player<select id="ap"></select></label><label>Status<select id="ast"><option>Available</option><option>Sold</option><option>Unsold</option><option>Withdrawn</option></select></label><label id="teamWrap">Team<select id="team"><option value="">Select team</option></select></label><label id="priceWrap">Sold price<input id="price" type="number" min="0" step="1"></label><button id="save" class="save">Save player</button><p id="msg"></p><div class="backup"><button id="export">Export results</button><label>Import results<input id="import" type="file" accept="application/json"></label><button id="reset">Reset all</button></div><p class="note">Changes are stored only in thi
